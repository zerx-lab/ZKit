version: "3"

vars:
  # Injected into the binary via -ldflags -X main.version; falls back to "dev"
  # outside a git checkout so `zkit version` / startup logs stay meaningful.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  build:
    desc: Build the Docker image
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t zkit:{{.TAG | default "latest"}} .

  run:
    desc: 'Run the image. APP_ENV=prod requires JWT_SECRET (>=32 bytes): JWT_SECRET=$(openssl rand -base64 48) task docker:run'
    preconditions:
      - sh: '[ -n "$JWT_SECRET" ] && [ "$JWT_SECRET" != "dev-insecure-change-me" ]'
        msg: 'Set a real JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -base64 48) task docker:run'
    cmds:
      - docker run --rm -p 8080:8080 -e APP_ENV=prod -e JWT_SECRET="$JWT_SECRET" zkit:{{.TAG | default "latest"}}

  up:
    desc: 'Start the full stack (app + postgres). Needs a real JWT_SECRET in the shell (the .env placeholder is refused in prod)'
    preconditions:
      - sh: '[ -n "$JWT_SECRET" ] && [ "$JWT_SECRET" != "dev-insecure-change-me" ]'
        msg: 'Set a real JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -base64 48) task docker:up'
    cmds:
      - VERSION={{.VERSION}} docker compose up -d --build

  down:
    desc: Stop the docker compose stack
    cmds:
      - docker compose down
