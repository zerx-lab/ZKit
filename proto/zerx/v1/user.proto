syntax = "proto3";

package zerx.v1;

import "buf/validate/validate.proto";
import "zerx/v1/common.proto";

option go_package = "github.com/zerx-lab/zkit/gen/go/zerx/v1;zerxv1";

// User is the public representation of an account (no password hash).
message User {
  uint64 id = 1;
  string email = 2;
  string name = 3;
  repeated string roles = 4;
  // created_at is RFC3339 formatted.
  string created_at = 5;
  string nickname = 6;
  string avatar = 7;
  string phone = 8;
  bool status = 9;
  bool totp_enabled = 10;
}

// UserService manages user accounts. Authorization is enforced by the Casbin
// interceptor (admin bypasses); handlers carry no role checks.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (User);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // ResetPassword sets a user's password to a new value (admin/RBAC-gated).
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // DisableUserTotp force-disables a user's 2FA (admin/RBAC-gated).
  rpc DisableUserTotp(DisableUserTotpRequest) returns (DisableUserTotpResponse);
}

message ListUsersRequest {
  zerx.v1.PageRequest page = 1;
  string keyword = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

message GetUserRequest {
  uint64 id = 1 [(buf.validate.field).uint64.gt = 0];
}

message CreateUserRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string password = 3 [(buf.validate.field).string.min_len = 8];
  repeated string roles = 4 [(buf.validate.field).repeated = {
    min_items: 1
    items: {string: {pattern: "^[a-z][a-z0-9_]*$"}}
  }];
  string nickname = 5;
  string phone = 6;
}

message UpdateUserRequest {
  uint64 id = 1 [(buf.validate.field).uint64.gt = 0];
  string name = 2;
  repeated string roles = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {string: {pattern: "^[a-z][a-z0-9_]*$"}}
  }];
  string nickname = 4;
  string phone = 5;
  bool status = 6;
}

message DeleteUserRequest {
  uint64 id = 1 [(buf.validate.field).uint64.gt = 0];
}

message DeleteUserResponse {}

message ResetPasswordRequest {
  uint64 id = 1 [(buf.validate.field).uint64.gt = 0];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message ResetPasswordResponse {}

message DisableUserTotpRequest {
  uint64 id = 1 [(buf.validate.field).uint64.gt = 0];
}

message DisableUserTotpResponse {}
